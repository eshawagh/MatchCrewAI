<!doctype html>
<html lang="en" data-theme="signal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchCrewAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[data-theme=signal]{--bg:#0b1220;--surface:#131c30;--line:#24324f;--ink:#e8eefc;--mute:#8d9bb8;--a:#3de0ff;--a2:#7c8cff;--on:#04141c;--r:14px;--glow:0 0 40px #3de0ff22}
[data-theme=paper]{--bg:#f6f4ee;--surface:#fffefa;--line:#dcd7c8;--ink:#16213a;--mute:#6b7287;--a:#1d3fd8;--a2:#f2a900;--on:#fff;--r:6px;--glow:none}
[data-theme=aurora]{--bg:#150d2b;--surface:#1f1440;--line:#3a2a6e;--ink:#f3ecff;--mute:#a597d4;--a:#ff5fb7;--a2:#4df0c4;--on:#2a0a1d;--r:22px;--glow:0 0 50px #ff5fb722}
[data-theme=terminal]{--bg:#07100a;--surface:#0d1a11;--line:#1f3a27;--ink:#c9f7d3;--mute:#6fa27c;--a:#5dff8a;--a2:#ffb547;--on:#03140a;--r:2px;--glow:none}
[data-theme=mint]{--bg:#e9f5ef;--surface:#ffffff;--line:#c3dfd1;--ink:#0f2e22;--mute:#52725f;--a:#0f7a55;--a2:#ff7a59;--on:#fff;--r:18px;--glow:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;transition:background .3s,color .3s}
[data-theme=terminal] body,[data-theme=terminal] button,[data-theme=terminal] input,[data-theme=terminal] select{font-family:ui-monospace,Menlo,Consolas,monospace}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--a2),var(--a));box-shadow:var(--glow);position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.themes{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink);transform:scale(1.12)}
.hero{padding:24px 0 18px;max-width:760px}
.hero h1{font-size:clamp(32px,5.5vw,54px);line-height:1.03;font-weight:800}
.hero p{color:var(--mute);font-size:16px;margin:12px 0 0;max-width:60ch}
.tabs{display:flex;gap:6px;margin:8px 0 18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;font-weight:700}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--a)}
.grid{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start;padding-bottom:60px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.filters input,.filters select,.f2 select{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:9px 10px;min-width:0;width:100%}
.filters input{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.chip,.btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--mute)}
[data-theme=terminal] .chip,[data-theme=terminal] .btn{border-radius:2px}
.chip[aria-pressed=true]{background:var(--a);color:var(--on);border-color:var(--a)}
.btn.pri{background:var(--a);color:var(--on);border-color:var(--a);font-weight:700;padding:9px 16px;border-radius:var(--r)}
.count{color:var(--mute);font-size:13px;margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:11px;transition:border-color .2s,box-shadow .2s}
.card.on{border-color:var(--a);box-shadow:var(--glow),0 0 0 1px var(--a)}
.top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:calc(var(--r)*.8);display:grid;place-items:center;font:800 16px "Bricolage Grotesque";color:var(--on);background:linear-gradient(135deg,var(--a),var(--a2));flex:none}
.name{background:none;border:0;padding:0;cursor:pointer;text-align:left;font:800 17px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.name:hover{color:var(--a)}
.top small{color:var(--mute);display:block}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills span{font-size:12px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--a) 14%,transparent);border:1px solid color-mix(in srgb,var(--a) 30%,transparent)}
[data-theme=terminal] .skills span{border-radius:2px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--mute);align-items:center}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a));border-radius:9px}
.meta{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.add{margin-top:auto;background:transparent;border:1px solid var(--a);color:var(--a);border-radius:var(--r);padding:8px;cursor:pointer;font-weight:700}
.card.on .add{background:var(--a);color:var(--on)}
aside{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--glow);max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:960px){aside{position:static;max-height:none}}
aside h2{font-size:22px}
.score{display:flex;align-items:baseline;gap:8px;margin:6px 0 0}
.score b{font:800 52px/1 "Bricolage Grotesque";color:var(--a)}
.score span{color:var(--mute)}
.radar{width:100%;max-width:280px;display:block;margin:4px auto}
.radar text{fill:var(--mute);font-size:11px}
.radar .ax{stroke:var(--line);fill:none}
.radar .shape{fill:color-mix(in srgb,var(--a) 28%,transparent);stroke:var(--a);stroke-width:2;transition:all .35s}
.radar .avg{fill:none;stroke:var(--a2);stroke-width:1.5;stroke-dasharray:4 3;transition:all .35s}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:14px;border-top:2px solid var(--a);vertical-align:middle;margin-right:5px}
.legend i.d{border-top:2px dashed var(--a2)}
.bd{display:grid;grid-template-columns:110px 1fr 38px;gap:5px 8px;font-size:12px;color:var(--mute);align-items:center;margin:12px 0}
.bd em{font-style:normal;text-align:right;color:var(--ink)}
.members{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.members li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:calc(var(--r)*.6)}
.members small{color:var(--mute);font-size:12px}
.members button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;line-height:1}
.tip{font-size:13px;color:var(--mute);margin:10px 0 0;border-left:3px solid var(--a2);padding-left:10px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.f2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.f2 select{width:auto}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tcard header{padding:0 0 8px;flex-wrap:nowrap}
.tcard h3{font-size:18px}
.tcard .s{font:800 26px "Bricolage Grotesque";color:var(--a)}
.tcard ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:5px;font-size:14px}
.tcard li button{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left}
.tcard li small{color:var(--mute)}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--a);border-radius:var(--r);padding:0;width:min(560px,94vw);box-shadow:var(--glow),0 20px 60px #0008}
dialog::backdrop{background:#0009}
.dg{padding:22px;display:grid;gap:14px}
.dg dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:14px}
.dg dt{color:var(--mute)}.dg dd{margin:0;overflow-wrap:anywhere}
.x{justify-self:end}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i></i>MatchCrewAI</div>
  <div class="themes" role="group" aria-label="Theme">Theme
    <button class="sw" data-t="signal" title="Signal" aria-label="Signal theme" style="background:linear-gradient(135deg,#0b1220 50%,#3de0ff 50%)"></button>
    <button class="sw" data-t="paper" title="Paper Lab" aria-label="Paper Lab theme" style="background:linear-gradient(135deg,#f6f4ee 50%,#1d3fd8 50%)"></button>
    <button class="sw" data-t="aurora" title="Aurora" aria-label="Aurora theme" style="background:linear-gradient(135deg,#150d2b 50%,#ff5fb7 50%)"></button>
    <button class="sw" data-t="terminal" title="Terminal" aria-label="Terminal theme" style="background:linear-gradient(135deg,#07100a 50%,#5dff8a 50%)"></button>
    <button class="sw" data-t="mint" title="Mint Studio" aria-label="Mint Studio theme" style="background:linear-gradient(135deg,#e9f5ef 50%,#0f7a55 50%)"></button>
  </div>
</header>
<section class="hero">
  <h1>Build crews that actually click.</h1>
  <p>Every field from your student survey drives the match: skills, domains, roles, availability, experience, work style, prior team experience and the four trait scores.</p>
</section>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t1" aria-selected="true" data-tab="1">Students</button>
  <button class="tab" role="tab" id="t2" aria-selected="false" data-tab="2">Auto-build teams</button>
</div>
<div id="p1" class="grid">
  <main>
    <div class="filters">
      <input id="q" type="search" placeholder="Search name, email, roll number, skill, role or domain" aria-label="Search students">
      <select id="fcls" aria-label="Class"></select><select id="fbr" aria-label="Branch"></select>
      <select id="frole" aria-label="Role"></select><select id="fav" aria-label="Availability"></select>
      <select id="fexp" aria-label="Experience"></select><select id="fpr" aria-label="Prior team project"></select>
      <select id="fst" aria-label="Work style"></select><select id="sort" aria-label="Sort"></select>
    </div>
    <div class="row"><div id="doms" class="row" style="margin:0"></div>
      <button class="btn" id="reset">Reset filters</button><span class="count" id="cnt"></span></div>
    <div id="cards" class="cards"></div>
  </main>
  <aside aria-live="polite">
    <h2>Your crew</h2>
    <div class="score"><b id="sc">0</b><span>/ 100 crew balance</span></div>
    <svg class="radar" id="radar" viewBox="0 0 300 260" role="img" aria-label="Crew trait radar"></svg>
    <div class="legend"><span><i></i>Peak</span><span><i class="d"></i>Average</span></div>
    <div class="bd" id="bd"></div>
    <ul class="members" id="mem"></ul>
    <p class="tip" id="tip"></p>
  </aside>
</div>
<div id="p2" hidden>
  <div class="f2"><label>Team size <select id="tsz"><option>3</option><option selected>4</option><option>5</option></select></label>
    <button class="btn pri" id="build">Build teams for all students</button><span class="count" id="tinfo"></span></div>
  <div id="teams" class="tcards"></div>
</div>
</div>
<dialog id="dlg"><div class="dg" id="dgc"></div></dialog>

  const slot=Math.max(...Object.values(cnt))/n;
  const adv=m.some(s=>s[10]==="Advanced"),beg=m.filter(s=>s[10]==="Beginner").length;
  const ex=(adv?.6:0)+(beg<=n/2?.4:.1);
  const styles=new Set(m.map(s=>s[13])).size;
  const parts=[
   ["Traits",peak.reduce((a,b)=>a+b,0)/20,35],
   ["Role variety",new Set(m.map(s=>s[7])).size/n,15],
   ["Skill breadth",Math.min(1,new Set(m.flatMap(s=>s[6])).size/(n*3)),15],
   ["Shared availability",slot,15],
   ["Experience mix",ex,10],
   ["Work-style mix",styles>=2?1:.4,5],
   ["Prior team work",m.filter(s=>s[11]==="Yes").length/n,5]];
  return{total:Math.round(parts.reduce((a,p)=>a+p[1]*p[2],0)),parts,peak,avg,slot:Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]};
}
function pt(j,v){const a=-Math.PI/2+j*Math.PI/2,r=v*22;return[150+r*Math.cos(a),130+r*Math.sin(a)]}
function crew(){
  const ids=[...sel],m=ids.map(i=>S[i]),e=evalTeam(m);
  let g="";
  for(let k=1;k<=5;k++)g+=`<polygon class="ax" points="${T.map((_,j)=>pt(j,k).join(",")).join(" ")}"/>`;
  g+=T.map((t,j)=>{const[x,y]=pt(j,5.9);return`<line class="ax" x1="150" y1="130" x2="${pt(j,5)[0]}" y2="${pt(j,5)[1]}"/><text x="${x}" y="${y+4}" text-anchor="middle">${t}</text>`}).join("");
  g+=`<polygon class="shape" points="${e.peak.map((v,j)=>pt(j,v).join(",")).join(" ")}"/><polygon class="avg" points="${e.avg.map((v,j)=>pt(j,v).join(",")).join(" ")}"/>`;
  $("radar").innerHTML=g;$("sc").textContent=e.total;
  $("bd").innerHTML=m.length?e.parts.map(p=>`<span>${p[0]}</span><div class="bar"><b style="width:${p[1]*100}%"></b></div><em>${Math.round(p[1]*p[2])}/${p[2]}</em>`).join(""):"";
  $("mem").innerHTML=ids.map(i=>`<li><span>${esc(S[i][0])}<br><small>${esc(S[i][7])} · ${esc(S[i][9])}</small></span><button data-r="${i}" aria-label="Remove ${esc(S[i][0])}">×</button></li>`).join("")||'<li class="empty" style="border:0">No one yet. Add students from the list.</li>';
  let tip="Add 3 to 5 students to get a suggestion.";
  if(m.length>=2){const w=e.parts.map(p=>[p[1],p[0]]).sort((a,b)=>a[0]-b[0])[0];
    tip=w[0]>=.85?"Well balanced across every dimension.":`Weakest area: ${w[1].toLowerCase()}. Look for a student who fills that gap.`;}
  $("tip").textContent=tip;
}
function open(i){const s=S[i];
  $("dgc").innerHTML=`<button class="btn x" id="cl">Close</button><div class="top"><div class="av">${ini(s[0])}</div><div><h2>${esc(s[0])}</h2><small style="color:var(--mute)">${esc(s[7])}</small></div></div>
  <dl><dt>Email</dt><dd>${esc(s[1])}</dd><dt>Roll number</dt><dd>${esc(s[2])}</dd><dt>Class and division</dt><dd>${esc(s[3])}</dd><dt>Branch</dt><dd>${esc(s[4])}</dd>
  <dt>Preferred domains</dt><dd>${esc(s[5].join(", "))}</dd><dt>Technical skills</dt><dd>${esc(s[6].join(", "))}</dd><dt>Working preference</dt><dd>${esc(s[8])} (${esc(s[13])})</dd>
  <dt>Availability</dt><dd>${esc(s[9])}</dd><dt>Experience level</dt><dd>${esc(s[10])}</dd><dt>Prior team project</dt><dd>${esc(s[11])}</dd></dl>
  <div class="bars">${T.map((t,j)=>`${t}<div class="bar"><b style="width:${s[12][j]*20}%"></b></div>`).join("")}</div>
  <button class="add" id="dadd">${sel.has(i)?"Remove from crew":"Add to crew"}</button>`;
  $("cl").onclick=()=>$("dlg").close();$("dadd").onclick=()=>{toggle(i);$("dlg").close()};$("dlg").showModal();}
function toggle(i){sel.has(i)?sel.delete(i):sel.add(i);cards();crew()}
// Auto-team builder: groups by availability first, greedily adds the student that raises the team score most, then merges leftovers
function build(){
  const N=+$("tsz").value,teams=[];
  const groups={};S.forEach((s,i)=>(groups[s[9]]??=[]).push(i));
  const left=[];
  function form(pool){
    pool=[...pool];const made=[];
    while(pool.length>=N){
      pool.sort((a,b)=>S[b][12][0]-S[a][12][0]||EXP[S[b][10]]-EXP[S[a][10]]);
      const t=[pool.shift()];
      while(t.length<N){let best=-1,bs=-1;
        pool.forEach((c,k)=>{const sc=evalTeam([...t,c].map(i=>S[i])).total;if(sc>bs){bs=sc;best=k}});
        t.push(pool.splice(best,1)[0]);}
      made.push(t);}
    return[made,pool];}
  for(const a in groups){const[m,r]=form(groups[a]);teams.push(...m);left.push(...r)}
  const[m2,r2]=form(left);teams.push(...m2);
  if(r2.length)teams.push(r2);
  const ev=teams.map(t=>({t,e:evalTeam(t.map(i=>S[i]))}));
  $("tinfo").textContent=`${teams.length} teams · average balance ${Math.round(ev.reduce((a,x)=>a+x.e.total,0)/ev.length)}/100`;
  $("teams").innerHTML=ev.map((x,k)=>`<article class="tcard"><header><h3>Team ${k+1}</h3><span class="s">${x.e.total}</span></header>
   <ul>${x.t.map(i=>`<li><button data-o="${i}">${esc(S[i][0])}</button> <small>${esc(S[i][7])} · ${esc(S[i][10])}</small></li>`).join("")}</ul>
   <div class="meta"><span>${x.e.slot}</span><span>${new Set(x.t.flatMap(i=>S[i][5])).size} domains</span><span>${new Set(x.t.flatMap(i=>S[i][6])).size} skills</span></div>
   <button class="btn" style="margin-top:10px" data-load="${k}">Load in crew builder</button></article>`).join("");
  window._ev=ev;
}
$("build").onclick=build;
$("teams").onclick=e=>{const o=e.target.dataset.o,l=e.target.dataset.load;
  if(o!=null)open(+o);
  if(l!=null){sel.clear();window._ev[+l].t.forEach(i=>sel.add(i));tab("1");cards();crew()}};
function tab(n){["1","2"].forEach(k=>{$("t"+k).setAttribute("aria-selected",k===n);$("p"+k).hidden=k!==n});}
document.querySelector(".tabs").onclick=e=>{if(e.target.dataset.tab)tab(e.target.dataset.tab)};
document.querySelector(".filters").addEventListener("input",cards);
$("doms").onclick=e=>{const d=e.target.dataset.d;if(!d)return;dom=dom===d?null:d;chips();cards()};
$("reset").onclick=()=>{$("q").value="";for(const k in F)$(F[k][0]).value="";dom=null;chips();cards()};
$("cards").onclick=e=>{const v=e.target.dataset.i,o=e.target.dataset.o;if(o!=null)open(+o);if(v!=null)toggle(+v)};
$("mem").onclick=e=>{const r=e.target.dataset.r;if(r!=null)toggle(+r)};
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));try{localStorage.setItem("mc-theme",t)}catch(e){}}
document.querySelector(".themes").onclick=e=>{if(e.target.dataset.t)setTheme(e.target.dataset.t)};
let t0=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"paper":"signal";
try{t0=localStorage.getItem("mc-theme")||t0}catch(e){}
setTheme(t0);chips();cards();crew();
</script>
